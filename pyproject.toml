[project]
name = "incidentops-starter"
version = "0.1.0"
description = "Proyecto semilla IncidentOps para Semana 1 de Ingeniería de Software Asistida por IA (ISIA)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.5",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "tiktoken>=0.8.0",
    "typer>=0.29.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    # <9.2: pytest 9.2 usa dataclass(slots=True) con campos init=False, que falla en
    # CPython 3.10.0 (AttributeError '_str_cache'). Retirar el tope al subir de 3.10.0.
    "pytest>=9.1,<9.2",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "postgres: necesita una base PostgreSQL de pruebas en INCIDENTOPS_TEST_POSTGRES_URL (spec 004)",
    "docker: necesita Docker con Compose v2 (spec 004)",
]

# Fronteras estáticas (Constitución, Principio IV). Las capas `domain`, `application` y
# `adapters/inbound` tienen su propio `ruff.toml` que extiende esta configuración y declara
# su lista completa de `banned-api` (TID251). Ejecutar siempre `uv run ruff check src/`
# sin `--config`: esa opción desactiva la configuración jerárquica.
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"
